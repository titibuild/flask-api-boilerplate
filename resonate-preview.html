<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0b1f" />
  <title>Resonate — London's Music Tribes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #0d0b1f;
  --card: #17142e;
  --card-2: #1f1b3a;
  --ink: #f4f2ff;
  --muted: #a39ec9;
  --line: rgba(255, 255, 255, 0.08);
  --violet: #7c5cff;
  --pink: #ff5ca8;
  --cyan: #2fe0d0;
  --grad: linear-gradient(135deg, #7c5cff 0%, #ff5ca8 100%);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: "Inter", system-ui, sans-serif;
  color: var(--ink);
  background: radial-gradient(120% 120% at 50% -10%, #1a1640 0%, #06050f 60%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px 40px;
  overflow-x: hidden;
}

/* Ambient blobs */
.ambient { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
.blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; }
.blob--violet { width: 340px; height: 340px; background: #6a3cff; top: -60px; left: -80px; }
.blob--pink   { width: 300px; height: 300px; background: #ff3d8b; bottom: -60px; right: -60px; }
.blob--cyan   { width: 240px; height: 240px; background: #1fd4c4; top: 40%; left: 50%; transform: translateX(-50%); opacity: 0.25; }

/* Phone frame */
.phone {
  position: relative;
  z-index: 1;
  width: 380px;
  max-width: 100%;
  height: 800px;
  max-height: 90vh;
  background: var(--bg);
  border-radius: 46px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow:
    0 0 0 11px #050410,
    0 0 0 13px #1c1838,
    0 40px 90px rgba(0, 0, 0, 0.6);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.notch {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 150px; height: 26px; background: #050410;
  border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;
  z-index: 30;
}

.statusbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 26px 4px; font-size: 13px; font-weight: 600; color: var(--ink);
}
.statusbar .icons { display: flex; align-items: center; gap: 7px; color: var(--ink); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); display: inline-block; }
.battery { width: 22px; height: 11px; border: 1.5px solid var(--ink); border-radius: 3px; position: relative; }
.battery::after { content: ""; position: absolute; inset: 1.5px; right: 6px; background: var(--ink); border-radius: 1px; }
.battery::before { content: ""; position: absolute; right: -3px; top: 3px; width: 2px; height: 5px; background: var(--ink); border-radius: 2px; }

.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }

/* Top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 14px; }
.brand { display: flex; align-items: center; gap: 11px; }
.logo {
  width: 42px; height: 42px; border-radius: 13px; background: var(--grad);
  display: grid; place-items: center; box-shadow: 0 8px 20px rgba(124, 92, 255, 0.45);
}
.hello { margin: 0; font-family: "Sora", sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.3px; }
.sub { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
.avatar { position: relative; width: 42px; height: 42px; border-radius: 50%; padding: 0; border: 2px solid rgba(255,255,255,0.15); background: none; cursor: pointer; }
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.online { position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; background: var(--cyan); border: 2px solid var(--bg); border-radius: 50%; }

/* Search */
.searchwrap { margin: 0 20px 6px; position: relative; }
.search-ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
#search {
  width: 100%; padding: 13px 14px 13px 42px; border-radius: 15px;
  background: var(--card); border: 1px solid var(--line); color: var(--ink);
  font-size: 14px; font-family: inherit; outline: none;
}
#search::placeholder { color: var(--muted); }
#search:focus { border-color: rgba(124, 92, 255, 0.6); }

/* Scroll area */
.scroll { flex: 1; overflow-y: auto; padding: 8px 0 0; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* Hero */
.hero {
  margin: 8px 20px 4px; padding: 20px; border-radius: 22px;
  background:
    radial-gradient(120% 130% at 100% 0%, rgba(255,92,168,0.35), transparent 60%),
    linear-gradient(135deg, #2a1f5c 0%, #3a1d52 100%);
  position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.08);
}
.hero-tag { font-size: 11px; font-weight: 600; color: var(--cyan); letter-spacing: 0.5px; text-transform: uppercase; }
.hero h1 { font-family: "Sora", sans-serif; font-weight: 800; font-size: 30px; line-height: 1.04; margin: 8px 0 8px; letter-spacing: -1px; }
.hero p { margin: 0 0 16px; font-size: 13px; color: #d9d4ff; max-width: 80%; line-height: 1.5; }
.cta {
  border: 0; background: #fff; color: #1a1140; font-weight: 700; font-size: 13.5px;
  padding: 11px 18px; border-radius: 13px; cursor: pointer; font-family: inherit;
  transition: transform 0.15s ease;
}
.cta:active { transform: scale(0.96); }
.hero-eq { position: absolute; right: 18px; bottom: 18px; display: flex; align-items: flex-end; gap: 4px; height: 46px; }
.hero-eq span { width: 5px; background: linear-gradient(var(--cyan), var(--pink)); border-radius: 3px; animation: eq 1.1s ease-in-out infinite; }
.hero-eq span:nth-child(1){height:40%;animation-delay:0s}
.hero-eq span:nth-child(2){height:80%;animation-delay:.15s}
.hero-eq span:nth-child(3){height:55%;animation-delay:.3s}
.hero-eq span:nth-child(4){height:100%;animation-delay:.1s}
.hero-eq span:nth-child(5){height:65%;animation-delay:.25s}
.hero-eq span:nth-child(6){height:35%;animation-delay:.4s}
.hero-eq span:nth-child(7){height:75%;animation-delay:.2s}
@keyframes eq { 0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1)} }

/* Chips */
.chips { display: flex; gap: 8px; padding: 16px 20px 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; padding: 8px 15px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: var(--card); color: var(--muted); border: 1px solid var(--line); cursor: pointer;
  font-family: inherit; transition: all 0.18s ease;
}
.chip.is-active { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(124,92,255,0.4); }

/* Blocks */
.block { padding: 16px 20px 0; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.block-head h2 { font-family: "Sora", sans-serif; font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.3px; }
.see { font-size: 12px; color: var(--violet); text-decoration: none; font-weight: 600; }

/* Community cards */
.cards { display: flex; flex-direction: column; gap: 12px; }
.card {
  display: flex; gap: 13px; padding: 12px; border-radius: 18px;
  background: var(--card); border: 1px solid var(--line); align-items: center;
  animation: rise 0.4s ease both;
}
.card .thumb { width: 60px; height: 60px; border-radius: 14px; object-fit: cover; flex: 0 0 auto; }
.card .body { flex: 1; min-width: 0; }
.card .name { font-family: "Sora", sans-serif; font-weight: 600; font-size: 14.5px; margin: 0; }
.card .meta { margin: 3px 0 7px; font-size: 11.5px; color: var(--muted); }
.card .facepile { display: flex; align-items: center; }
.card .facepile img { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--card); margin-left: -7px; }
.card .facepile img:first-child { margin-left: 0; }
.card .facepile small { margin-left: 8px; font-size: 11px; color: var(--muted); }
.join {
  flex: 0 0 auto; border: 0; padding: 9px 16px; border-radius: 11px; font-weight: 700; font-size: 12.5px;
  background: rgba(124,92,255,0.16); color: #c5b8ff; cursor: pointer; font-family: inherit; transition: all 0.18s ease;
}
.join:active { transform: scale(0.94); }
.join.joined { background: rgba(47,224,208,0.16); color: var(--cyan); }
.tag-pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.06); color: var(--muted); margin-right: 6px; text-transform: capitalize; }

/* Events */
.events { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.events::-webkit-scrollbar { display: none; }
.event {
  flex: 0 0 200px; border-radius: 18px; overflow: hidden; background: var(--card);
  border: 1px solid var(--line); animation: rise 0.4s ease both;
}
.event .cover { height: 110px; position: relative; background-size: cover; background-position: center; }
.event .date { position: absolute; top: 10px; left: 10px; background: rgba(7,5,20,0.78); backdrop-filter: blur(6px); border-radius: 10px; padding: 5px 9px; text-align: center; }
.event .date .d { display: block; font-family: "Sora", sans-serif; font-weight: 800; font-size: 16px; line-height: 1; }
.event .date .m { display: block; font-size: 9px; color: var(--cyan); text-transform: uppercase; letter-spacing: 0.5px; }
.event .info { padding: 11px 12px 13px; }
.event .info h3 { font-family: "Sora", sans-serif; font-size: 13.5px; margin: 0 0 4px; font-weight: 600; }
.event .info p { margin: 0; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }

.footer-space { height: 18px; }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Tab bar */
.tabbar {
  display: flex; align-items: center; justify-content: space-around;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  background: rgba(10, 8, 26, 0.9); backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
}
.tab {
  background: none; border: 0; color: var(--muted); cursor: pointer; font-family: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 600;
  padding: 4px 6px; transition: color 0.18s ease;
}
.tab.is-active { color: var(--ink); }
.tab.is-active svg { color: var(--violet); }
.tab--fab {
  width: 52px; height: 52px; border-radius: 18px; background: var(--grad); color: #fff;
  justify-content: center; margin-top: -22px; box-shadow: 0 10px 24px rgba(124,92,255,0.5);
}
.tab--fab.is-active { color: #fff; }

.hint { position: relative; z-index: 1; margin: 18px 0 0; font-size: 12px; color: rgba(255,255,255,0.4); text-align: center; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 20px);
  background: var(--grad); color: #fff; padding: 12px 20px; border-radius: 14px;
  font-size: 13px; font-weight: 600; z-index: 100; opacity: 0; pointer-events: none;
  transition: all 0.3s ease; box-shadow: 0 12px 30px rgba(124,92,255,0.5);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

</style>
</head>
<body>
  <!-- Ambient background glow -->
  <div class="ambient">
    <span class="blob blob--violet"></span>
    <span class="blob blob--pink"></span>
    <span class="blob blob--cyan"></span>
  </div>

  <!-- Phone frame -->
  <div class="phone" role="application" aria-label="Resonate mobile app">
    <div class="notch"></div>

    <!-- Status bar -->
    <div class="statusbar">
      <span class="time">9:41</span>
      <span class="icons">
        <i class="dot"></i>
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><path d="M1 7l2-2 2 2M5 9l2-2 2 2M9 5l2-2 2 2M13 7l2-2 2 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span class="battery"></span>
      </span>
    </div>

    <!-- App screen -->
    <main class="screen">

      <!-- Header -->
      <header class="topbar">
        <div class="brand">
          <div class="logo">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M9 18V6l10-2v10" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" stroke="#fff" stroke-width="2"/><circle cx="16.5" cy="16" r="2.5" stroke="#fff" stroke-width="2"/></svg>
          </div>
          <div>
            <p class="hello">Resonate</p>
            <p class="sub">London · 14 communities near you</p>
          </div>
        </div>
        <button class="avatar" aria-label="Profile">
          <img src="https://i.pravatar.cc/80?img=15" alt="Your profile" />
          <span class="online"></span>
        </button>
      </header>

      <!-- Search -->
      <div class="searchwrap">
        <svg class="search-ic" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search genres, crews, nights…" aria-label="Search" />
      </div>

      <!-- Scrollable content -->
      <div class="scroll" id="scroll">

        <!-- Hero -->
        <section class="hero">
          <div class="hero-copy">
            <span class="hero-tag">Tonight in London</span>
            <h1>Find your<br/>frequency.</h1>
            <p>Connect with the people who move to your sound — from Peckham jazz to Hackney techno.</p>
            <button class="cta">Explore the scene →</button>
          </div>
          <div class="hero-eq" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </section>

        <!-- Genre chips -->
        <div class="chips" id="chips" role="tablist" aria-label="Filter by genre">
          <button class="chip is-active" data-genre="all">All</button>
          <button class="chip" data-genre="techno">Techno</button>
          <button class="chip" data-genre="jazz">Jazz</button>
          <button class="chip" data-genre="afrobeats">Afrobeats</button>
          <button class="chip" data-genre="indie">Indie</button>
          <button class="chip" data-genre="dnb">D&B</button>
          <button class="chip" data-genre="soul">Soul</button>
        </div>

        <!-- Communities -->
        <section class="block">
          <div class="block-head">
            <h2>Communities for you</h2>
            <a href="#" class="see">See all</a>
          </div>

          <div class="cards" id="communities">
            <!-- cards injected by JS -->
          </div>
        </section>

        <!-- Events -->
        <section class="block">
          <div class="block-head">
            <h2>Upcoming meetups</h2>
            <a href="#" class="see">See all</a>
          </div>

          <div class="events" id="events"><!-- injected --></div>
        </section>

        <div class="footer-space"></div>
      </div>

      <!-- Bottom nav -->
      <nav class="tabbar" aria-label="Primary">
        <button class="tab is-active" data-tab="home">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M3 11l9-7 9 7v8a2 2 0 01-2 2h-4v-6H9v6H5a2 2 0 01-2-2v-8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span>Home</span>
        </button>
        <button class="tab" data-tab="discover">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M15.5 8.5l-2 5-5 2 2-5 5-2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span>Discover</span>
        </button>
        <button class="tab tab--fab" data-tab="create" aria-label="Create">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
        <button class="tab" data-tab="events">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Events</span>
        </button>
        <button class="tab" data-tab="chat">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M4 5h16v11H9l-4 3v-3H4V5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span>Crews</span>
        </button>
      </nav>
    </main>
  </div>

  <p class="hint">Tap chips, join communities, and switch tabs — it's interactive.</p>

  <script>
// ---- Sample data: London music communities & meetups ----
const communities = [
  {
    name: "Peckham Jazz Collective",
    genre: "jazz",
    area: "Peckham · SE15",
    members: "2.4k",
    thumb: "https://images.unsplash.com/photo-1511192336575-5a79af67a629?w=200&q=70",
    faces: [11, 32, 5],
  },
  {
    name: "Hackney Techno Underground",
    genre: "techno",
    area: "Hackney Wick · E9",
    members: "5.1k",
    thumb: "https://images.unsplash.com/photo-1571266028243-e4733b0f3f0a?w=200&q=70",
    faces: [12, 45, 23],
  },
  {
    name: "Brixton Afrobeats Crew",
    genre: "afrobeats",
    area: "Brixton · SW9",
    members: "3.8k",
    thumb: "https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=200&q=70",
    faces: [8, 60, 14],
  },
  {
    name: "Camden Indie Heads",
    genre: "indie",
    area: "Camden · NW1",
    members: "1.9k",
    thumb: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=200&q=70",
    faces: [33, 21, 9],
  },
  {
    name: "Croydon D&B Massive",
    genre: "dnb",
    area: "Croydon · CR0",
    members: "4.2k",
    thumb: "https://images.unsplash.com/photo-1574169208507-84376144848b?w=200&q=70",
    faces: [52, 17, 41],
  },
  {
    name: "Soho Soul Society",
    genre: "soul",
    area: "Soho · W1",
    members: "1.3k",
    thumb: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=200&q=70",
    faces: [3, 28, 36],
  },
];

const events = [
  {
    d: "12", m: "Jun", title: "Late Night Jazz Jam", where: "Total Refreshment Centre",
    cover: "https://images.unsplash.com/photo-1415201364774-f6f0bb35f28f?w=400&q=70",
  },
  {
    d: "14", m: "Jun", title: "Warehouse Techno", where: "Bermondsey Arches",
    cover: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=400&q=70",
  },
  {
    d: "18", m: "Jun", title: "Afrobeats Block Party", where: "Brixton Village",
    cover: "https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?w=400&q=70",
  },
  {
    d: "21", m: "Jun", title: "Indie Open Mic", where: "The Dublin Castle",
    cover: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=400&q=70",
  },
];

// ---- Render helpers ----
const $ = (s) => document.querySelector(s);
const face = (id) => `https://i.pravatar.cc/40?img=${id}`;

let activeGenre = "all";
let query = "";

function renderCommunities() {
  const list = communities.filter((c) => {
    const matchGenre = activeGenre === "all" || c.genre === activeGenre;
    const matchQuery =
      !query ||
      c.name.toLowerCase().includes(query) ||
      c.genre.toLowerCase().includes(query) ||
      c.area.toLowerCase().includes(query);
    return matchGenre && matchQuery;
  });

  const wrap = $("#communities");
  if (!list.length) {
    wrap.innerHTML = `<p style="color:var(--muted);font-size:13px;text-align:center;padding:24px 0">No crews match that — try another genre.</p>`;
    return;
  }

  wrap.innerHTML = list
    .map(
      (c, i) => `
    <article class="card" style="animation-delay:${i * 60}ms">
      <img class="thumb" src="${c.thumb}" alt="${c.name}" loading="lazy" />
      <div class="body">
        <p class="name">${c.name}</p>
        <p class="meta"><span class="tag-pill">${c.genre}</span>${c.area}</p>
        <div class="facepile">
          ${c.faces.map((f) => `<img src="${face(f)}" alt="" />`).join("")}
          <small>${c.members} members</small>
        </div>
      </div>
      <button class="join" data-name="${c.name}">Join</button>
    </article>`
    )
    .join("");
}

function renderEvents() {
  $("#events").innerHTML = events
    .map(
      (e, i) => `
    <article class="event" style="animation-delay:${i * 70}ms">
      <div class="cover" style="background-image:linear-gradient(transparent 50%, rgba(7,5,20,0.6)), url('${e.cover}')">
        <div class="date"><span class="d">${e.d}</span><span class="m">${e.m}</span></div>
      </div>
      <div class="info">
        <h3>${e.title}</h3>
        <p>📍 ${e.where}</p>
      </div>
    </article>`
    )
    .join("");
}

// ---- Toast ----
let toastTimer;
function toast(msg) {
  let t = $(".toast");
  if (!t) {
    t = document.createElement("div");
    t.className = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add("show"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1900);
}

// ---- Events / interactivity ----
document.addEventListener("click", (e) => {
  // Genre chips
  const chip = e.target.closest(".chip");
  if (chip) {
    document.querySelectorAll(".chip").forEach((c) => c.classList.remove("is-active"));
    chip.classList.add("is-active");
    activeGenre = chip.dataset.genre;
    renderCommunities();
    return;
  }

  // Join buttons
  const join = e.target.closest(".join");
  if (join) {
    if (join.classList.contains("joined")) {
      join.classList.remove("joined");
      join.textContent = "Join";
      toast(`Left ${join.dataset.name}`);
    } else {
      join.classList.add("joined");
      join.textContent = "Joined ✓";
      toast(`You joined ${join.dataset.name} 🎶`);
    }
    return;
  }

  // Tab bar
  const tab = e.target.closest(".tab");
  if (tab) {
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("is-active"));
    tab.classList.add("is-active");
    const labels = {
      home: "Home",
      discover: "Discover the London scene",
      create: "Start a new community",
      events: "Your events",
      chat: "Your crews",
    };
    if (tab.dataset.tab !== "home") toast(labels[tab.dataset.tab]);
    $("#scroll").scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  // CTA
  if (e.target.closest(".cta")) {
    $("#scroll").scrollTo({ top: 400, behavior: "smooth" });
  }
});

$("#search").addEventListener("input", (e) => {
  query = e.target.value.trim().toLowerCase();
  renderCommunities();
});

// ---- Boot ----
renderCommunities();
renderEvents();

</script>
